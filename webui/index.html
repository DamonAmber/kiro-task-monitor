<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Kiro 任务监控</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.png" />
    <meta name="theme-color" content="#1c1c20" />
    <!-- iOS 全屏（添加到主屏幕后无浏览器边框，随设备横竖屏旋转） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kiro 监控" />
    <link rel="apple-touch-icon" href="icon.png" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="topbar-left">
          <span class="logo">◐</span>
          <span class="brand">Kiro 任务监控</span>
        </div>
        <div class="topbar-right">
          <span class="counts" id="counts"></span>
          <button class="icon-btn" id="btn-stats" title="任务战报" aria-label="任务战报">
            <svg class="ic-svg" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.5" y="9" width="3" height="5" rx="1"></rect>
              <rect x="6.5" y="5.5" width="3" height="8.5" rx="1"></rect>
              <rect x="11.5" y="2.5" width="3" height="11.5" rx="1"></rect>
            </svg>
          </button>
          <button class="notif-btn" id="notif-btn" title="开启完成/出错通知">🔕</button>
          <span class="conn" id="conn" title="连接状态"><i class="conn-dot"></i><span id="conn-text">连接中…</span></span>
        </div>
      </header>

      <!-- 本机核心能力异常提醒（如无法读取会话数据），只读远端也能看到原因 -->
      <div class="perm-banner hidden" id="perm-banner">
        <span class="perm-banner-icon">⛔️</span>
        <span class="perm-banner-text" id="perm-banner-text"></span>
      </div>

      <main class="list" id="list">
        <div class="empty" id="empty">正在连接…</div>
      </main>

      <footer class="usage hidden" id="usage">
        <div class="usage-head">
          <span class="usage-main" id="usage-main"></span>
          <span class="usage-pct" id="usage-pct"></span>
        </div>
        <div class="usage-track"><div class="usage-fill" id="usage-fill"></div></div>
        <div class="usage-sub" id="usage-sub"></div>
      </footer>

      <!-- 页内提示（通知开启时的可靠兜底，无论系统通知是否可用） -->
      <div class="toasts" id="toasts"></div>

      <!-- 任务战报（只读，与桌面端一致） -->
      <section class="stats hidden" id="stats">
        <div class="stats-head">
          <span>任务战报</span>
          <button class="icon-btn" id="btn-stats-close" title="关闭" aria-label="关闭">✕</button>
        </div>
        <div class="stats-body">
          <div class="stats-range">
            <button class="seg active" data-range="today">今日</button>
            <button class="seg" data-range="7d">近 7 天</button>
          </div>
          <div class="stats-metrics" id="stats-metrics"></div>
          <div class="stats-block">
            <div class="stats-block-head">完成 / 出错分布</div>
            <div class="stats-chart" id="stats-chart"></div>
          </div>
          <div class="stats-block">
            <div class="stats-block-head">按工作区</div>
            <div class="stats-list" id="stats-ws"></div>
          </div>
          <div class="stats-block">
            <div class="stats-block-head">按模型</div>
            <div class="stats-list" id="stats-model"></div>
          </div>
          <div class="stats-block" id="stats-fail-block">
            <div class="stats-block-head">失败原因</div>
            <div class="stats-list" id="stats-fail"></div>
          </div>
          <div class="stats-note" id="stats-note"></div>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
