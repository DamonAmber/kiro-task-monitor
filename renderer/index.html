<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Kiro 任务监控</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar" id="titlebar">
        <div class="titlebar-left">
          <span class="logo">◐</span>
          <span class="title">Kiro 任务</span>
          <span class="counts" id="counts"></span>
        </div>
        <div class="titlebar-right nodrag">
          <button class="icon-btn" id="btn-settings" title="设置">⚙</button>
          <button class="icon-btn" id="btn-hide" title="隐藏">—</button>
        </div>
      </header>

      <main class="list" id="list">
        <div class="empty" id="empty">正在读取 Kiro 会话…</div>
      </main>

      <!-- 设置面板 -->
      <section class="settings hidden" id="settings">
        <div class="settings-head">
          <span>设置</span>
          <button class="icon-btn nodrag" id="btn-settings-close">✕</button>
        </div>
        <div class="settings-body">
          <label class="row"><span>出错 / 卡住时通知</span><input type="checkbox" data-cfg="notifyFailed" /></label>
          <label class="row"><span>完成时通知</span><input type="checkbox" data-cfg="notifyDone" /></label>
          <label class="row"><span>等待确认时通知</span><input type="checkbox" data-cfg="notifyWaiting" /></label>
          <label class="row"><span>失败播放提示音</span><input type="checkbox" data-cfg="soundOnFailed" /></label>
          <hr />
          <label class="row"><span>出错时<b>自动</b>重试</span><input type="checkbox" data-cfg="autoRetry" /></label>
          <label class="row"><span>重试发送内容</span><input type="text" data-cfg="retryMessage" class="text-in" /></label>
          <label class="row"><span>重试后自动回车</span><input type="checkbox" data-cfg="retrySend" /></label>
          <hr />
          <label class="row"><span>只显示<b>已打开</b>的会话</span><input type="checkbox" data-cfg="onlyOpenSessions" /></label>
          <label class="row"><span>每个窗口只看<b>当前</b>会话</span><input type="checkbox" data-cfg="onlyFocusedSession" /></label>
          <hr />
          <label class="row"><span>卡死超时兜底</span><input type="checkbox" data-cfg="stuckDetection" /></label>
          <div class="hint">出错/取消始终靠事件即时识别，与此无关。关掉后长任务不会被误报卡住，但进程崩溃/休眠等「静默中断」将无法察觉。</div>
          <label class="row"><span>卡住阈值·无工具（秒）</span><input type="number" min="60" step="30" data-cfg="stuckSeconds" class="num-in" /></label>
          <label class="row"><span>卡住阈值·工具执行中（秒）</span><input type="number" min="120" step="60" data-cfg="toolStuckSeconds" class="num-in" /></label>
          <label class="row"><span>显示最近（小时）</span><input type="number" min="1" step="1" data-cfg="activeWithinHours" class="num-in" /></label>
          <label class="row"><span>窗口置顶</span><input type="checkbox" data-cfg="alwaysOnTop" /></label>
          <div class="hint">重试依赖「辅助功能」权限：系统设置 › 隐私与安全性 › 辅助功能。</div>
          <hr />
          <div class="update-box">
            <div class="update-row">
              <span id="version">Kiro 任务监控</span>
              <button class="mini-btn nodrag" id="btn-check-update">检查更新</button>
            </div>
            <div class="update-status" id="update-status"></div>
            <button class="update-btn nodrag hidden" id="btn-install-update">重启并更新</button>
          </div>
          <button class="quit-btn nodrag" id="btn-quit">退出监控</button>
        </div>
      </section>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
